<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f1115" />
<meta name="description" content="每天 50 个墨墨难词，四选一测验：看英文选中文，或看中文选英文" />
<title>每日测验 · 墨墨难词看板</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="favicon.ico" sizes="any" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="每日测验" />
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1e222b; --line: #262b36;
    --text: #e8ecf3; --dim: #8b93a5; --accent: #6f8cff; --warn: #ffb454;
    --bad: #ff6b6b; --good: #4ade80;
  }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { padding-bottom: 40px; }
  header { position: sticky; top: 0; z-index: 20; background: rgba(15,17,21,.92);
    backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .bar { max-width: 880px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 10px; }
  .title { font-size: 17px; font-weight: 700; letter-spacing: .3px; }
  .title span { color: var(--dim); font-weight: 400; font-size: 12px; margin-left: 8px; }
  .spacer { flex: 1; }
  a.back { color: var(--dim); text-decoration: none; font-size: 18px; padding: 4px 8px; border-radius: 8px; }
  a.back:hover { background: var(--panel2); color: var(--text); }
  button { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line);
    border-radius: 10px; padding: 9px 14px; cursor: pointer; transition: .15s; }
  button:active { transform: scale(.98); }
  button.primary { background: linear-gradient(180deg,#3f5bd8,#3348b8); border-color: #3a51c9; }
  button[disabled] { opacity: .6; cursor: default; }
  select { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line);
    border-radius: 10px; padding: 8px 10px; }
  main { max-width: 680px; margin: 0 auto; padding: 18px 16px; }

  .progress { height: 6px; border-radius: 999px; background: var(--panel2); overflow: hidden; margin-bottom: 6px; }
  .progress > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg,#4ade80,#6f8cff); transition: width .25s; }
  .meta { display: flex; align-items: center; gap: 10px; color: var(--dim); font-size: 12.5px; margin-bottom: 18px; }
  .badge { border: 1px solid var(--line); border-radius: 999px; padding: 3px 9px; color: var(--accent); }

  .prompt { background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
    padding: 34px 20px; text-align: center; margin-bottom: 16px; }
  .prompt .cn { font-size: 22px; line-height: 1.5; }
  .prompt .en { font-size: 34px; font-weight: 700; letter-spacing: .5px; }
  .prompt .hint { color: var(--dim); font-size: 12px; margin-top: 10px; }

  .opts { display: grid; gap: 10px; }
  .opt { text-align: left; padding: 15px 16px; font-size: 15.5px; line-height: 1.45; border-radius: 12px;
    display: flex; gap: 12px; align-items: flex-start; }
  .opt .k { color: var(--dim); font-size: 12px; border: 1px solid var(--line); border-radius: 6px;
    min-width: 20px; text-align: center; padding: 1px 4px; margin-top: 2px; }
  .opt.ok { background: rgba(74,222,128,.12); border-color: #2f7a4d; }
  .opt.no { background: rgba(255,107,107,.12); border-color: #7f3a3a; }
  .opt.reveal { border-color: #2f7a4d; }

  .foot { display: flex; align-items: center; gap: 10px; margin-top: 16px; color: var(--dim); font-size: 13px; }
  .foot .grow { flex: 1; }

  .center { text-align: center; }
  .big { font-size: 40px; font-weight: 700; letter-spacing: .5px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px; margin-bottom: 14px; }
  .kv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; text-align: center; }
  .kv b { display: block; font-size: 26px; }
  .kv span { color: var(--dim); font-size: 12.5px; }
  .wrong { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
  .wrow { display: flex; gap: 10px; align-items: baseline; border-bottom: 1px dashed var(--line); padding-bottom: 8px; }
  .wrow b { min-width: 120px; }
  .wrow span { color: var(--dim); font-size: 13.5px; }
  .hintline { color: var(--dim); font-size: 13px; line-height: 1.7; }

  button.ghost { background: transparent; border-color: var(--line); color: var(--dim); padding: 8px 12px; font-size: 13.5px; white-space: nowrap; flex: 0 0 auto; }
  button.ghost:hover { color: var(--text); }
  @media (max-width: 520px) { #btnAccount { padding: 8px 9px; font-size: 12.5px; } }
  .modal { position: fixed; inset: 0; z-index: 60; display: none; align-items: flex-end; justify-content: center;
    background: rgba(0,0,0,.62); padding: 0; }
  .modal.on { display: flex; }
  .sheet { width: 100%; max-width: 520px; background: var(--panel2); border: 1px solid var(--line);
    border-radius: 16px 16px 0 0; padding: 18px 18px 22px; max-height: 88vh; overflow: auto; }
  @media (min-width: 640px) { .modal { align-items: center; } .sheet { border-radius: 16px; } }
  .sheet h3 { margin: 0 0 8px; font-size: 16px; }
  .field { display: block; margin: 12px 0; }
  .field span { display: block; color: var(--dim); font-size: 12.5px; margin-bottom: 6px; }
  .field input { width: 100%; font: inherit; color: var(--text); background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; }
  .field input:focus { outline: none; border-color: #3f56a8; }
  .autherr { color: var(--bad); font-size: 13px; min-height: 18px; margin: 4px 0 8px; }
  .authrow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .tiny { color: #6d7488; font-size: 11.5px; line-height: 1.7; margin: 10px 0 0; }
  .grow { flex: 1; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 16px); opacity: 0;
    pointer-events: none; background: #1b2130; border: 1px solid var(--line); color: var(--text);
    padding: 10px 14px; border-radius: 10px; font-size: 13px; z-index: 80; transition: .2s; }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }
  @media (max-width: 520px) {
    .prompt .en { font-size: 28px; }
    .prompt .cn { font-size: 19px; }
    .kv b { font-size: 22px; }
    .wrow { flex-direction: column; gap: 2px; }
    .wrow b { min-width: 0; }
  }
</style>
</head>
<body>
<header>
  <div class="bar">
    <a class="back" href="index.html" title="回到看板">←</a>
    <div class="title">每日测验<span id="dateLabel"></span></div>
    <div class="spacer"></div>
    <button id="btnAccount" class="ghost" hidden>登录同步</button>
    <select id="mode" title="出题方向">
      <option value="mixed">混合方向</option>
      <option value="en2cn">英 → 中</option>
      <option value="cn2en">中 → 英</option>
    </select>
  </div>
</header>

<main id="main"></main>

<div class="modal" id="authModal">
  <div class="sheet">
    <h3 id="authTitle">登录，进度存云端</h3>
    <p class="hintline" id="authHint">登录后换手机、换电脑都接着做；朋友注册自己的账号，各存各的进度。</p>
    <form id="authForm" autocomplete="on">
      <label class="field"><span>邮箱</span><input id="email" type="email" required placeholder="you@example.com" autocomplete="username" /></label>
      <label class="field"><span>密码</span><input id="password" type="password" required minlength="6" placeholder="至少 6 位" autocomplete="current-password" /></label>
      <div class="autherr" id="authErr"></div>
      <div class="authrow">
        <button type="submit" class="primary" id="btnSubmit">登录</button>
        <button type="button" id="btnSwitch">没有账号？注册</button>
        <button type="button" class="ghost" id="btnCloseAuth">以后再说</button>
      </div>
    </form>
    <p class="tiny">只用邮箱+密码，不收集别的。密码由 Supabase 保存，本站只存登录凭证。</p>
  </div>
</div>

<div class="modal" id="accModal">
  <div class="sheet">
    <h3>账号</h3>
    <p class="hintline" id="accWho"></p>
    <p class="tiny" id="accSync"></p>
    <div class="authrow">
      <button type="button" id="btnSyncNow">立即同步</button>
      <button type="button" id="btnSignOut">退出登录</button>
      <span class="grow"></span>
      <button type="button" class="ghost" id="btnCloseAcc">关闭</button>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="cloud.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const STATIC = !!window.__QUIZ_POOL__;
const SIZE = 50;
const KEY = 'maimemo-quiz-v1';
const ADOPTED_FLAG = 'maimemo-quiz-v1:adopted';

let POOL = [];
let MODE = localStorage.getItem(KEY + ':mode') || 'mixed';
let today = '';
let setNo = 1;
let qs = [];      // 今天的题目
let idx = 0;
let answers = {}; // word -> true/false
let wrong = [];   // 错词（保留顺序）
let startedAt = 0;
let cur = null;   // 当前题
let locked = false;

// —— 可复现的随机数：同一天、同一组，题目永远一样 ——
function hashSeed(str) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < str.length; i++) h = Math.imul(h ^ str.charCodeAt(i), 16777619);
  return h >>> 0;
}
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function todayStr() {
  const d = new Date();
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}

// —— 进度存储：本地 localStorage 打底，登录后同步到云端 ——
let DAYS = {};        // { 'YYYY-MM-DD': {set, order, idx, answers, wrong, startedAt} }
let ACCOUNT = null;   // 当前登录用户
let pushTimer = 0;
let pushFor = '';
let pushState = 'idle'; // idle | pending | saving | saved | error

function storeKey() {
  return ACCOUNT ? KEY + ':u:' + ACCOUNT.id : KEY + ':guest';
}
function readKey(k) {
  try {
    const raw = localStorage.getItem(k);
    if (!raw) return {};
    const o = JSON.parse(raw);
    return o && o.days ? o.days : o; // 兼容老版本（没有 days 包裹）
  } catch { return {}; }
}
function readLocal() {
  // 升级：老版本把进度直接存在 KEY 里，第一次读到就归到「游客」
  try {
    const legacy = localStorage.getItem(KEY);
    if (legacy && !localStorage.getItem(KEY + ':guest')) {
      localStorage.setItem(KEY + ':guest', JSON.stringify({ v: 2, days: readKey(KEY) }));
      localStorage.removeItem(KEY);
    }
  } catch {}
  return readKey(storeKey());
}
function writeLocal() {
  try { localStorage.setItem(storeKey(), JSON.stringify({ v: 2, days: DAYS })); } catch {}
}
function ansCount(rec) {
  return rec && rec.answers ? Object.keys(rec.answers).length : 0;
}
// 两边的进度取「做得更多」的那份；forceToday 时云端今天的记录直接覆盖本地
function mergeDays(remote, forceToday) {
  if (!remote || typeof remote !== 'object') return false;
  let changed = false;
  for (const d of Object.keys(remote)) {
    const r = remote[d];
    if (!r || !Array.isArray(r.order)) continue;
    if (forceToday && d === today) { DAYS[d] = r; changed = true; continue; }
    if (ansCount(r) > ansCount(DAYS[d])) { DAYS[d] = r; changed = true; }
  }
  return changed;
}
function persist() {
  DAYS[today] = { set: setNo, order: qs.map((q) => q.p.w), idx, answers, wrong, startedAt };
  writeLocal();
  queuePush();
}

function trimmedDays() {
  const ks = Object.keys(DAYS).sort().slice(-60); // 只同步最近 60 天，别把 metadata 撑大
  const o = {};
  for (const k of ks) o[k] = DAYS[k];
  return o;
}
function queuePush() {
  if (!window.Cloud || !Cloud.configured() || !ACCOUNT) return;
  pushState = 'pending';
  pushFor = ACCOUNT.id;
  paintSync();
  clearTimeout(pushTimer);
  pushTimer = setTimeout(doPush, 1200);
}
async function doPush() {
  if (!ACCOUNT || ACCOUNT.id !== pushFor) return; // 切过账号，旧任务作废
  pushState = 'saving';
  paintSync();
  try {
    await Cloud.push({ v: 2, days: trimmedDays(), updatedAt: new Date().toISOString() });
    pushState = 'saved';
  } catch (e) {
    pushState = 'error';
    console.warn('同步失败', e);
  }
  paintSync();
}

function toast(msg) {
  let el = $('toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'toast';
    el.className = 'toast';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('on'), 2600);
}

function paintSync() {
  const el = $('accSync');
  if (!el) return;
  const map = {
    idle: ACCOUNT ? '云端已连接' : '未登录，只存在这台设备',
    pending: '有改动，正在同步…',
    saving: '正在同步…',
    saved: '已同步到云端',
    error: '同步失败，点「立即同步」重试',
  };
  el.textContent = map[pushState] || '';
}

function paintAccount() {
  const btn = $('btnAccount');
  if (!btn) return;
  if (!window.Cloud || !Cloud.configured()) { btn.hidden = true; return; }
  btn.hidden = false;
  btn.textContent = ACCOUNT ? (ACCOUNT.email || '已登录').split('@')[0] : '登录同步';
  $('accWho').textContent = ACCOUNT ? ACCOUNT.email : '';
  paintSync();
}

async function pullAndMerge() {
  if (!ACCOUNT) return false;
  let remoteQuiz = null;
  try {
    const p = await Cloud.pull();
    remoteQuiz = p && p.quiz;
  } catch (e) {
    pushState = 'error';
    paintSync();
    return false;
  }
  let changed = mergeDays(remoteQuiz && remoteQuiz.days, true);
  const cloudEmpty = !remoteQuiz || !remoteQuiz.days || !Object.keys(remoteQuiz.days).length;
  // 云端还没东西、这台设备也没这个账号的缓存：把游客进度接过来（每台设备只做一次）
  if (cloudEmpty && !Object.keys(DAYS).length && !localStorage.getItem(ADOPTED_FLAG)) {
    const g = readKey(KEY + ':guest');
    if (Object.keys(g).length) {
      DAYS = g;
      changed = true;
      try { localStorage.setItem(ADOPTED_FLAG, '1'); } catch {}
      toast('已把本机的游客进度接到这个账号');
    }
  }
  if (changed) { writeLocal(); queuePush(); }
  pushState = 'saved';
  paintSync();
  return changed;
}

async function cloudInit() {
  if (!window.Cloud || !Cloud.configured()) return;
  $('btnAccount').hidden = false;
  Cloud.onChange((u) => { ACCOUNT = u; paintAccount(); });
  ACCOUNT = Cloud.user();
  paintAccount();
  if (ACCOUNT) { DAYS = readLocal(); await pullAndMerge(); }
}

// 抽样：先上「真的忘过」的词（遗忘次数加权），再用难度分补足，不看今天该不该复习
function shuffleWith(arr, rand) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function forgetWeight(p) {
  return (p.f || 0) * 6 + (p.v || 0) * 3 + (p.sticky || 0) * 2;
}

function pickWords(rand, want) {
  const picked = [];
  const seen = new Set();
  const take = (candidates, n) => {
    const free = shuffleWith(candidates.filter((p) => !seen.has(p.w)), rand);
    for (const p of free.slice(0, n)) {
      seen.add(p.w);
      picked.push(p);
    }
  };

  // 1) 忘过 / 标过顽固的词：按遗忘程度排序，最多占 40%（但也保证至少 10 个，如果够的话）
  const forgotten = POOL.filter((p) => forgetWeight(p) > 0).sort((a, b) => forgetWeight(b) - forgetWeight(a));
  take(forgotten, Math.min(forgotten.length, Math.max(10, Math.round(want * 0.4))));

  // 2) 难度分最高的那批里随机抽，保证轮换但不至于天天同一个词
  const hardCount = Math.max(100, Math.min(300, Math.round(POOL.length * 0.11)));
  const hard = POOL.slice().sort((a, b) => b.s - a.s).slice(0, hardCount);
  take(hard, want - picked.length);

  // 3) 还不够就从全库随机补（新词、刚学的词也能轮到）
  take(POOL, want - picked.length);
  return shuffleWith(picked, rand);
}

function buildQuestions(rand, words) {
  return words.map((p) => {
    const dir = MODE === 'mixed' ? (rand() < 0.5 ? 'en2cn' : 'cn2en') : MODE;
    const others = [];
    const used = new Set([p.cn]);
    const pool = POOL.filter((x) => x.w !== p.w);
    for (let guard = 0; others.length < 3 && guard < 400; guard++) {
      const cand = pool[Math.floor(rand() * pool.length)];
      if (!cand || used.has(cand.cn)) continue;
      used.add(cand.cn);
      others.push(cand);
    }
    const options = [p, ...others];
    // 洗牌
    for (let i = options.length - 1; i > 0; i--) {
      const j = Math.floor(rand() * (i + 1));
      [options[i], options[j]] = [options[j], options[i]];
    }
    return { p, dir, options };
  });
}

function seedKey(n) {
  const who = ACCOUNT ? 'u' + ACCOUNT.id.slice(0, 8) : 'guest';
  return today + '#' + (n || setNo) + '#' + who;
}

function makeToday() {
  today = todayStr();
  const rec = DAYS[today];
  if (rec && rec.set === setNo && rec.order && rec.order.length) {
    // 恢复今天的进度
    const rnd = mulberry32(hashSeed(seedKey(rec.set)));
    const byWord = new Map(POOL.map((p) => [p.w, p]));
    const words = rec.order.map((w) => byWord.get(w)).filter(Boolean);
    qs = words.length ? buildQuestions(rnd, words) : [];
    answers = rec.answers || {};
    wrong = rec.wrong || [];
    idx = rec.idx || 0;
    startedAt = rec.startedAt || Date.now();
  } else {
    const rnd = mulberry32(hashSeed(seedKey(setNo)));
    const words = pickWords(rnd, SIZE);
    qs = buildQuestions(rnd, words);
    answers = {}; wrong = []; idx = 0; startedAt = Date.now();
    persist();
  }
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

function render() {
  $('dateLabel').textContent = today.replace(/-/g, '/');
  if (idx >= qs.length) return renderDone();
  const q = qs[idx];
  cur = q;
  locked = false;

  const isEn = q.dir === 'en2cn';
  const promptHtml = isEn
    ? `<div class="en">${esc(q.p.w)}</div><div class="hint">选出正确的中文意思</div>`
    : `<div class="cn">${esc(q.p.cn)}</div><div class="hint">选出对应的英文单词</div>`;

  const opts = q.options.map((o, i) => {
    const label = isEn ? o.cn : o.w;
    return `<button class="opt" data-i="${i}"><span class="k">${i + 1}</span><span>${esc(label)}</span></button>`;
  }).join('');

  const done = Object.keys(answers).length;
  $('main').innerHTML = `
    <div class="progress"><i style="width:${(done / qs.length) * 100}%"></i></div>
    <div class="meta">
      <span>第 ${idx + 1} / ${qs.length} 题</span>
      <span class="badge">${isEn ? '英 → 中' : '中 → 英'}</span>
      <span class="spacer" style="flex:1"></span>
      <span>正确 ${Object.values(answers).filter(Boolean).length} · 错误 ${wrong.length}</span>
    </div>
    <div class="prompt">${promptHtml}</div>
    <div class="opts" id="opts">${opts}</div>
    <div class="foot">
      <span id="fb"></span>
      <span class="grow"></span>
      <button id="next" class="primary" hidden>下一题</button>
    </div>`;

  $('opts').querySelectorAll('.opt').forEach((btn) => {
    btn.addEventListener('click', () => answer(Number(btn.dataset.i)));
  });
  $('next').addEventListener('click', () => { idx++; persist(); render(); });
}

function answer(i) {
  if (locked) return;
  locked = true;
  const q = cur;
  const isEn = q.dir === 'en2cn';
  const chosen = q.options[i];
  const ok = chosen.w === q.p.w;

  answers[q.p.w] = ok;
  if (!ok) {
    if (!wrong.some((x) => x.w === q.p.w)) wrong.push({ w: q.p.w, cn: q.p.cn });
  }

  $('opts').querySelectorAll('.opt').forEach((btn, k) => {
    btn.disabled = true;
    if (q.options[k].w === q.p.w) btn.classList.add(ok ? 'ok' : 'reveal');
    if (k === i && !ok) btn.classList.add('no');
  });

  $('fb').innerHTML = ok
    ? `<span style="color:var(--good)">答对了</span>`
    : `<span style="color:var(--bad)">答错了</span> · <b>${esc(q.p.w)}</b> = ${esc(q.p.cn)}`;
  const nextBtn = $('next');
  nextBtn.hidden = false;
  nextBtn.textContent = idx + 1 >= qs.length ? '看成绩' : '下一题';
  persist();

  // 答对了自动翻页，答错留一步给你看正确答案
  if (ok) setTimeout(() => { if (locked && !$('next').hidden) { idx++; persist(); render(); } }, 650);
}

function renderDone() {
  const total = qs.length;
  const right = Object.values(answers).filter(Boolean).length;
  const secs = Math.max(1, Math.round((Date.now() - startedAt) / 1000));
  const rate = total ? Math.round((right / total) * 100) : 0;

  $('main').innerHTML = `
    <div class="card center">
      <div class="big">${right} / ${total}</div>
      <div class="hintline">正确率 ${rate}% · 用时 ${Math.floor(secs / 60)} 分 ${secs % 60} 秒</div>
    </div>
    ${wrong.length ? `<div class="card"><div style="margin-bottom:8px;color:var(--warn)">错的 ${wrong.length} 个词</div>
      <div class="wrong">${wrong.map((x) => `<div class="wrow"><b>${esc(x.w)}</b><span>${esc(x.cn)}</span></div>`).join('')}</div></div>` : ''}
    <div class="card">
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        ${wrong.length >= 4 ? '<button class="primary" id="again">再练这 ' + wrong.length + ' 个错词</button>' : ''}
        <button id="redo">重做今天这组</button>
        <button id="newset">换一组</button>
      </div>
      <div class="hintline" style="margin-top:12px">明天 0 点会自动换新的一组 50 个词。</div>
    </div>`;

  const again = $('again');
  if (again) again.addEventListener('click', () => practiceWrong());
  $('redo').addEventListener('click', () => {
    answers = {}; wrong = []; idx = 0; startedAt = Date.now(); persist(); render();
  });
  $('newset').addEventListener('click', () => {
    setNo += 1;
    const rnd = mulberry32(hashSeed(seedKey(setNo)));
    qs = buildQuestions(rnd, pickWords(rnd, SIZE));
    answers = {}; wrong = []; idx = 0; startedAt = Date.now();
    persist(); render();
  });
}

function practiceWrong() {
  const words = wrong.slice();
  const rnd = mulberry32(Date.now() >>> 0);
  const byWord = new Map(POOL.map((p) => [p.w, p]));
  qs = buildQuestions(rnd, words.map((x) => byWord.get(x.w)).filter(Boolean));
  answers = {}; wrong = []; idx = 0; startedAt = Date.now();
  render();
}

document.addEventListener('keydown', (e) => {
  if (cur && !locked && e.key >= '1' && e.key <= '4') answer(Number(e.key) - 1);
  else if (e.key === 'Enter' && cur && locked) { idx++; persist(); render(); }
});

$('mode').value = MODE;
$('mode').addEventListener('change', () => {
  MODE = $('mode').value;
  localStorage.setItem(KEY + ':mode', MODE);
  // 方向换了，题目按新方向重排，进度重来
  const rnd = mulberry32(hashSeed(seedKey(setNo)));
  qs = buildQuestions(rnd, qs.map((q) => q.p));
  answers = {}; wrong = []; idx = 0; startedAt = Date.now();
  persist(); render();
});

// —— 账号界面 ——
let authMode = 'login';

function zhErr(err) {
  const m = String((err && err.message) || err || '');
  if (/Invalid login credentials/i.test(m)) return '邮箱或密码不对';
  if (/User already registered/i.test(m)) return '这个邮箱已经注册过了，直接登录就行';
  if (/Email not confirmed/i.test(m)) return '邮箱还没确认：去点邮件里的链接，或在 Supabase 关掉「Confirm email」';
  if (/at least 6 characters/i.test(m)) return '密码至少 6 位';
  if (/Unable to validate email/i.test(m)) return '邮箱格式不对';
  if (/Failed to fetch|Load failed|NetworkError/i.test(m)) return '连不上云端服务：检查 config.js 里的 URL，或换个网络';
  return m || '出错了，再试一次';
}

function openAuth(mode) {
  authMode = mode || 'login';
  $('authErr').textContent = '';
  $('authModal').classList.add('on');
  setTimeout(() => $('email').focus(), 50);
}
function syncAuthUI() {
  const login = authMode === 'login';
  $('authTitle').textContent = login ? '登录，进度存云端' : '注册一个账号';
  $('btnSubmit').textContent = login ? '登录' : '注册';
  $('btnSwitch').textContent = login ? '没有账号？注册' : '已有账号？登录';
  $('password').autocomplete = login ? 'current-password' : 'new-password';
}

$('btnAccount').addEventListener('click', () => {
  if (!window.Cloud || !Cloud.configured()) return;
  if (ACCOUNT) { paintAccount(); $('accModal').classList.add('on'); }
  else { syncAuthUI(); openAuth('login'); }
});
$('btnSwitch').addEventListener('click', () => { authMode = authMode === 'login' ? 'signup' : 'login'; syncAuthUI(); });
$('btnCloseAuth').addEventListener('click', () => $('authModal').classList.remove('on'));
$('btnCloseAcc').addEventListener('click', () => $('accModal').classList.remove('on'));
$('authModal').addEventListener('click', (e) => { if (e.target.id === 'authModal') $('authModal').classList.remove('on'); });
$('accModal').addEventListener('click', (e) => { if (e.target.id === 'accModal') $('accModal').classList.remove('on'); });

$('authForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = $('email').value.trim();
  const pw = $('password').value;
  $('authErr').textContent = '';
  if (!window.Cloud || !Cloud.configured()) { $('authErr').textContent = '云同步还没配置（app/config.js 里缺 url / anonKey）。'; return; }
  $('btnSubmit').disabled = true;
  try {
    if (authMode === 'login') {
      await Cloud.signIn(email, pw);
    } else {
      const r = await Cloud.signUp(email, pw);
      if (r && r.needConfirm) {
        $('authErr').textContent = '注册成功，但要先点邮件里的确认链接（或在 Supabase 关掉 Confirm email）。';
        return;
      }
    }
    ACCOUNT = Cloud.user();
    $('authModal').classList.remove('on');
    DAYS = readLocal(); // 换成这个账号自己的本地进度
    paintAccount();
    const merged = await pullAndMerge();
    makeToday();
    render();
    toast(merged ? '已登录，云端进度已合并' : '已登录，进度会存到云端');
  } catch (err) {
    $('authErr').textContent = zhErr(err);
  } finally {
    $('btnSubmit').disabled = false;
  }
});

$('btnSyncNow').addEventListener('click', async () => {
  await doPush();
  toast(pushState === 'saved' ? '已同步' : '同步失败，检查网络后重试');
});
$('btnSignOut').addEventListener('click', () => {
  Cloud.signOut();
  ACCOUNT = null;
  clearTimeout(pushTimer);
  pushFor = '';
  DAYS = readLocal(); // 回到游客进度
  $('accModal').classList.remove('on');
  paintAccount();
  makeToday();
  render();
  toast('已退出，进度还在本机');
});

async function init() {
  DAYS = readLocal();
  if (STATIC) {
    POOL = window.__QUIZ_POOL__.pool || [];
  } else {
    try {
      const r = await fetch('/api/quiz', { cache: 'no-store' });
      const j = await r.json();
      POOL = j.pool || [];
    } catch (e) {
      $('main').innerHTML = `<div class="card">读不到词库：${esc(e.message)}</div>`;
      return;
    }
  }
  if (!POOL.length) {
    $('main').innerHTML = '<div class="card">词库是空的。先在电脑上跑一次 <code>tools/fetch-glosses.mjs</code> 生成中文释义。</div>';
    return;
  }
  await cloudInit();
  makeToday();
  render();
}

init();
</script>
