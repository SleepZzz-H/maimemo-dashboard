<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f1115" />
<meta name="description" content="每天 50 个墨墨难词，四选一测验：看英文选中文，或看中文选英文" />
<title>每日测验 · 墨墨难词看板</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="favicon.ico" sizes="any" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="每日测验" />
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1e222b; --line: #262b36;
    --text: #e8ecf3; --dim: #8b93a5; --accent: #6f8cff; --warn: #ffb454;
    --bad: #ff6b6b; --good: #4ade80;
  }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { padding-bottom: 40px; }
  header { position: sticky; top: 0; z-index: 20; background: rgba(15,17,21,.92);
    backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .bar { max-width: 880px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 10px; }
  .title { font-size: 17px; font-weight: 700; letter-spacing: .3px; }
  .title span { color: var(--dim); font-weight: 400; font-size: 12px; margin-left: 8px; }
  .spacer { flex: 1; }
  a.back { color: var(--dim); text-decoration: none; font-size: 18px; padding: 4px 8px; border-radius: 8px; }
  a.back:hover { background: var(--panel2); color: var(--text); }
  button { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line);
    border-radius: 10px; padding: 9px 14px; cursor: pointer; transition: .15s; }
  button:active { transform: scale(.98); }
  button.primary { background: linear-gradient(180deg,#3f5bd8,#3348b8); border-color: #3a51c9; }
  button[disabled] { opacity: .6; cursor: default; }
  select { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line);
    border-radius: 10px; padding: 8px 10px; }
  main { max-width: 680px; margin: 0 auto; padding: 18px 16px; }

  .progress { height: 6px; border-radius: 999px; background: var(--panel2); overflow: hidden; margin-bottom: 6px; }
  .progress > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg,#4ade80,#6f8cff); transition: width .25s; }
  .meta { display: flex; align-items: center; gap: 10px; color: var(--dim); font-size: 12.5px; margin-bottom: 18px; }
  .badge { border: 1px solid var(--line); border-radius: 999px; padding: 3px 9px; color: var(--accent); }

  .prompt { background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
    padding: 34px 20px; text-align: center; margin-bottom: 16px; }
  .prompt .cn { font-size: 22px; line-height: 1.5; }
  .prompt .en { font-size: 34px; font-weight: 700; letter-spacing: .5px; }
  .prompt .hint { color: var(--dim); font-size: 12px; margin-top: 10px; }

  .opts { display: grid; gap: 10px; }
  .opt { text-align: left; padding: 15px 16px; font-size: 15.5px; line-height: 1.45; border-radius: 12px;
    display: flex; gap: 12px; align-items: flex-start; }
  .opt .k { color: var(--dim); font-size: 12px; border: 1px solid var(--line); border-radius: 6px;
    min-width: 20px; text-align: center; padding: 1px 4px; margin-top: 2px; }
  .opt.ok { background: rgba(74,222,128,.12); border-color: #2f7a4d; }
  .opt.no { background: rgba(255,107,107,.12); border-color: #7f3a3a; }
  .opt.reveal { border-color: #2f7a4d; }

  .foot { display: flex; align-items: center; gap: 10px; margin-top: 16px; color: var(--dim); font-size: 13px; }
  .foot .grow { flex: 1; }

  .center { text-align: center; }
  .big { font-size: 40px; font-weight: 700; letter-spacing: .5px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px; margin-bottom: 14px; }
  .kv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; text-align: center; }
  .kv b { display: block; font-size: 26px; }
  .kv span { color: var(--dim); font-size: 12.5px; }
  .wrong { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
  .wrow { display: flex; gap: 10px; align-items: baseline; border-bottom: 1px dashed var(--line); padding-bottom: 8px; }
  .wrow b { min-width: 120px; }
  .wrow span { color: var(--dim); font-size: 13.5px; }
  .hintline { color: var(--dim); font-size: 13px; line-height: 1.7; }
  @media (max-width: 520px) {
    .prompt .en { font-size: 28px; }
    .prompt .cn { font-size: 19px; }
    .kv b { font-size: 22px; }
    .wrow { flex-direction: column; gap: 2px; }
    .wrow b { min-width: 0; }
  }
</style>
</head>
<body>
<header>
  <div class="bar">
    <a class="back" href="index.html" title="回到看板">←</a>
    <div class="title">每日测验<span id="dateLabel"></span></div>
    <div class="spacer"></div>
    <select id="mode" title="出题方向">
      <option value="mixed">混合方向</option>
      <option value="en2cn">英 → 中</option>
      <option value="cn2en">中 → 英</option>
    </select>
  </div>
</header>

<main id="main"></main>

<script>
const $ = (id) => document.getElementById(id);
const STATIC = !!window.__QUIZ_POOL__;
const SIZE = 50;
const KEY = 'maimemo-quiz-v1';

let POOL = [];
let MODE = localStorage.getItem(KEY + ':mode') || 'mixed';
let today = '';
let setNo = 1;
let qs = [];      // 今天的题目
let idx = 0;
let answers = {}; // word -> true/false
let wrong = [];   // 错词（保留顺序）
let startedAt = 0;
let cur = null;   // 当前题
let locked = false;

// —— 可复现的随机数：同一天、同一组，题目永远一样 ——
function hashSeed(str) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < str.length; i++) h = Math.imul(h ^ str.charCodeAt(i), 16777619);
  return h >>> 0;
}
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function todayStr() {
  const d = new Date();
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}

function loadState() {
  try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch { return {}; }
}
function saveState(s) {
  try { localStorage.setItem(KEY, JSON.stringify(s)); } catch {}
}

// 抽样：15 个今天该复习的 + 25 个最难的 + 剩下随机补，兼顾「加强记忆」和覆盖面
function shuffleWith(arr, rand) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pickWords(rand, want) {
  const picked = [];
  const seen = new Set();
  const take = (candidates, n) => {
    const free = shuffleWith(candidates.filter((p) => !seen.has(p.w)), rand);
    for (const p of free.slice(0, n)) {
      seen.add(p.w);
      picked.push(p);
    }
  };
  const due = POOL.filter((p) => p.dueIn !== null && p.dueIn <= 0);
  const hardCount = Math.max(60, Math.min(300, Math.round(POOL.length * 0.08)));
  const hard = POOL.slice().sort((a, b) => b.s - a.s).slice(0, hardCount);

  take(due, Math.round(want * 0.3));
  take(hard, Math.round(want * 0.5));
  take(POOL, want - picked.length);
  return shuffleWith(picked, rand);
}

function buildQuestions(rand, words) {
  return words.map((p) => {
    const dir = MODE === 'mixed' ? (rand() < 0.5 ? 'en2cn' : 'cn2en') : MODE;
    const others = [];
    const used = new Set([p.cn]);
    const pool = POOL.filter((x) => x.w !== p.w);
    for (let guard = 0; others.length < 3 && guard < 400; guard++) {
      const cand = pool[Math.floor(rand() * pool.length)];
      if (!cand || used.has(cand.cn)) continue;
      used.add(cand.cn);
      others.push(cand);
    }
    const options = [p, ...others];
    // 洗牌
    for (let i = options.length - 1; i > 0; i--) {
      const j = Math.floor(rand() * (i + 1));
      [options[i], options[j]] = [options[j], options[i]];
    }
    return { p, dir, options };
  });
}

function makeToday() {
  today = todayStr();
  const saved = loadState();
  const rec = saved[today];
  if (rec && rec.set === setNo && rec.order && rec.order.length) {
    // 恢复今天的进度
    const rnd = mulberry32(hashSeed(today + '#' + setNo));
    const byWord = new Map(POOL.map((p) => [p.w, p]));
    const words = rec.order.map((w) => byWord.get(w)).filter(Boolean);
    qs = words.length ? buildQuestions(rnd, words) : [];
    answers = rec.answers || {};
    wrong = rec.wrong || [];
    idx = rec.idx || 0;
    startedAt = rec.startedAt || Date.now();
  } else {
    const rnd = mulberry32(hashSeed(today + '#' + setNo));
    const words = pickWords(rnd, SIZE);
    qs = buildQuestions(rnd, words);
    answers = {}; wrong = []; idx = 0; startedAt = Date.now();
    persist();
  }
}

function persist() {
  const s = loadState();
  s[today] = {
    set: setNo,
    order: qs.map((q) => q.p.w),
    idx,
    answers,
    wrong,
    startedAt,
  };
  saveState(s);
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

function render() {
  $('dateLabel').textContent = today.replace(/-/g, '/');
  if (idx >= qs.length) return renderDone();
  const q = qs[idx];
  cur = q;
  locked = false;

  const isEn = q.dir === 'en2cn';
  const promptHtml = isEn
    ? `<div class="en">${esc(q.p.w)}</div><div class="hint">选出正确的中文意思</div>`
    : `<div class="cn">${esc(q.p.cn)}</div><div class="hint">选出对应的英文单词</div>`;

  const opts = q.options.map((o, i) => {
    const label = isEn ? o.cn : o.w;
    return `<button class="opt" data-i="${i}"><span class="k">${i + 1}</span><span>${esc(label)}</span></button>`;
  }).join('');

  const done = Object.keys(answers).length;
  $('main').innerHTML = `
    <div class="progress"><i style="width:${(done / qs.length) * 100}%"></i></div>
    <div class="meta">
      <span>第 ${idx + 1} / ${qs.length} 题</span>
      <span class="badge">${isEn ? '英 → 中' : '中 → 英'}</span>
      <span class="spacer" style="flex:1"></span>
      <span>正确 ${Object.values(answers).filter(Boolean).length} · 错误 ${wrong.length}</span>
    </div>
    <div class="prompt">${promptHtml}</div>
    <div class="opts" id="opts">${opts}</div>
    <div class="foot">
      <span id="fb"></span>
      <span class="grow"></span>
      <button id="next" class="primary" hidden>下一题</button>
    </div>`;

  $('opts').querySelectorAll('.opt').forEach((btn) => {
    btn.addEventListener('click', () => answer(Number(btn.dataset.i)));
  });
  $('next').addEventListener('click', () => { idx++; persist(); render(); });
}

function answer(i) {
  if (locked) return;
  locked = true;
  const q = cur;
  const isEn = q.dir === 'en2cn';
  const chosen = q.options[i];
  const ok = chosen.w === q.p.w;

  answers[q.p.w] = ok;
  if (!ok) {
    if (!wrong.some((x) => x.w === q.p.w)) wrong.push({ w: q.p.w, cn: q.p.cn });
  }

  $('opts').querySelectorAll('.opt').forEach((btn, k) => {
    btn.disabled = true;
    if (q.options[k].w === q.p.w) btn.classList.add(ok ? 'ok' : 'reveal');
    if (k === i && !ok) btn.classList.add('no');
  });

  $('fb').innerHTML = ok
    ? `<span style="color:var(--good)">答对了</span>`
    : `<span style="color:var(--bad)">答错了</span> · <b>${esc(q.p.w)}</b> = ${esc(q.p.cn)}`;
  const nextBtn = $('next');
  nextBtn.hidden = false;
  nextBtn.textContent = idx + 1 >= qs.length ? '看成绩' : '下一题';
  persist();

  // 答对了自动翻页，答错留一步给你看正确答案
  if (ok) setTimeout(() => { if (locked && !$('next').hidden) { idx++; persist(); render(); } }, 650);
}

function renderDone() {
  const total = qs.length;
  const right = Object.values(answers).filter(Boolean).length;
  const secs = Math.max(1, Math.round((Date.now() - startedAt) / 1000));
  const rate = total ? Math.round((right / total) * 100) : 0;

  $('main').innerHTML = `
    <div class="card center">
      <div class="big">${right} / ${total}</div>
      <div class="hintline">正确率 ${rate}% · 用时 ${Math.floor(secs / 60)} 分 ${secs % 60} 秒</div>
    </div>
    ${wrong.length ? `<div class="card"><div style="margin-bottom:8px;color:var(--warn)">错的 ${wrong.length} 个词</div>
      <div class="wrong">${wrong.map((x) => `<div class="wrow"><b>${esc(x.w)}</b><span>${esc(x.cn)}</span></div>`).join('')}</div></div>` : ''}
    <div class="card">
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        ${wrong.length >= 4 ? '<button class="primary" id="again">再练这 ' + wrong.length + ' 个错词</button>' : ''}
        <button id="redo">重做今天这组</button>
        <button id="newset">换一组</button>
      </div>
      <div class="hintline" style="margin-top:12px">明天 0 点会自动换新的一组 50 个词。</div>
    </div>`;

  const again = $('again');
  if (again) again.addEventListener('click', () => practiceWrong());
  $('redo').addEventListener('click', () => {
    answers = {}; wrong = []; idx = 0; startedAt = Date.now(); persist(); render();
  });
  $('newset').addEventListener('click', () => {
    setNo += 1;
    const rnd = mulberry32(hashSeed(today + '#' + setNo));
    qs = buildQuestions(rnd, pickWords(rnd, SIZE));
    answers = {}; wrong = []; idx = 0; startedAt = Date.now();
    persist(); render();
  });
}

function practiceWrong() {
  const words = wrong.slice();
  const rnd = mulberry32(Date.now() >>> 0);
  const byWord = new Map(POOL.map((p) => [p.w, p]));
  qs = buildQuestions(rnd, words.map((x) => byWord.get(x.w)).filter(Boolean));
  answers = {}; wrong = []; idx = 0; startedAt = Date.now();
  render();
}

document.addEventListener('keydown', (e) => {
  if (cur && !locked && e.key >= '1' && e.key <= '4') answer(Number(e.key) - 1);
  else if (e.key === 'Enter' && cur && locked) { idx++; persist(); render(); }
});

$('mode').value = MODE;
$('mode').addEventListener('change', () => {
  MODE = $('mode').value;
  localStorage.setItem(KEY + ':mode', MODE);
  // 方向换了，题目按新方向重排，进度重来
  const rnd = mulberry32(hashSeed(today + '#' + setNo));
  qs = buildQuestions(rnd, qs.map((q) => q.p));
  answers = {}; wrong = []; idx = 0; startedAt = Date.now();
  persist(); render();
});

async function init() {
  if (STATIC) {
    POOL = window.__QUIZ_POOL__.pool || [];
  } else {
    try {
      const r = await fetch('/api/quiz', { cache: 'no-store' });
      const j = await r.json();
      POOL = j.pool || [];
    } catch (e) {
      $('main').innerHTML = `<div class="card">读不到词库：${esc(e.message)}</div>`;
      return;
    }
  }
  if (!POOL.length) {
    $('main').innerHTML = '<div class="card">词库是空的。先在电脑上跑一次 <code>tools/fetch-glosses.mjs</code> 生成中文释义。</div>';
    return;
  }
  makeToday();
  render();
}

init();
</script>
</body>
</html>
